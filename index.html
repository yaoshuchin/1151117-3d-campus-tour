    <!-- 通行門禁安全防護樣式 (Password Gate Styles) -->
    <style>
      #passwordGate {
        position: fixed;
        inset: 0;
        z-index: 9999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, rgba(38, 16, 22, 0.94) 0%, rgba(14, 14, 18, 0.98) 100%);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
        color: #f1f5f9;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease;
        padding: 20px;
        box-sizing: border-box;
      }

      #passwordGate.gate-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .gate-card {
        position: relative;
        width: 100%;
        max-width: 440px;
        background: rgba(30, 30, 42, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px rgba(163, 18, 43, 0.28);
        border-radius: 28px;
        padding: 38px 32px;
        text-align: center;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-sizing: border-box;
      }

      .gate-badge-wrap {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(163, 18, 43, 0.2);
        border: 1px solid rgba(163, 18, 43, 0.5);
        color: #ff8a9e;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-bottom: 18px;
      }

      .gate-title {
        font-size: 1.68rem;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 10px 0;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      .gate-subtitle {
        font-size: 0.92rem;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 26px 0;
      }

      .gate-input-group {
        position: relative;
        margin-bottom: 20px;
        text-align: left;
      }

      .gate-input-label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 8px;
      }

      .gate-input-box {
        position: relative;
        display: flex;
        align-items: center;
      }

      .gate-input {
        width: 100%;
        height: 52px;
        padding: 0 48px 0 16px;
        background: rgba(15, 15, 22, 0.85);
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        color: #ffffff;
        font-size: 1.05rem;
        outline: none;
        transition: all 0.25s ease;
        box-sizing: border-box;
      }

      .gate-input:focus {
        border-color: #a3122b;
        box-shadow: 0 0 0 3px rgba(163, 18, 43, 0.35);
        background: rgba(20, 20, 30, 0.95);
      }

      .gate-toggle-pw {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        padding: 6px;
        font-size: 1.15rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
      }
      .gate-toggle-pw:hover {
        color: #ffffff;
      }

      .gate-btn {
        width: 100%;
        height: 52px;
        background: linear-gradient(135deg, #c51838 0%, #a3122b 100%);
        color: #ffffff;
        border: none;
        border-radius: 14px;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 8px 24px -4px rgba(163, 18, 43, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .gate-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -4px rgba(163, 18, 43, 0.65);
        background: linear-gradient(135deg, #d81d40 0%, #b21430 100%);
      }

      .gate-btn:active {
        transform: translateY(1px);
        box-shadow: 0 4px 12px rgba(163, 18, 43, 0.4);
      }

      .gate-error {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 0.85rem;
        color: #ff5c77;
        margin-top: 14px;
        font-weight: 600;
      }

      .gate-card.shake {
        animation: gateShake 0.45s ease-in-out;
      }

      @keyframes gateShake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-8px); }
        40%, 80% { transform: translateX(8px); }
      }

      /* 浮動安全鎖定按鈕 (Floating Relock Button) */
      #gateRelockBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 99999;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(20, 20, 30, 0.76);
        color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 9px 18px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: all 0.25s ease;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        user-select: none;
      }

      #gateRelockBtn:hover {
        background: rgba(163, 18, 43, 0.88);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.35);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body data-mode="walk">
    <canvas id="game" aria-label="世新大學 3D 校園場景"></canvas>
    <div id="labels"></div>
    <div id="ui"></div>

    <!-- 浮動安全鎖定按鈕 -->
    <button id="gateRelockBtn" title="點擊重新鎖定網站">
      <span>🔒</span>
      <span>鎖定網站</span>
    </button>

    <!-- 磨砂玻璃通行門禁系統 (Password Gate) -->
    <div id="passwordGate">
      <div class="gate-card" id="gateCard">
        <div class="gate-badge-wrap">
          <span>🏫</span>
          <span>世新大學・漫遊校園 3D</span>
        </div>
        <h1 class="gate-title">校園導覽存取保護</h1>
        <p class="gate-subtitle">
          本系統已啟用通行身分驗證<br>請輸入通行金鑰以解鎖進入第一人稱漫遊
        </p>

        <form id="gateForm" onsubmit="event.preventDefault(); window.verifyGatePass();">
          <div class="gate-input-group">
            <label class="gate-input-label" for="gatePasswordInput">通行金鑰 (Passcode)</label>
            <div class="gate-input-box">
              <input
                type="password"
                id="gatePasswordInput"
                class="gate-input"
                placeholder="請輸入通行金鑰..."
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="gate-toggle-pw"
                id="gateTogglePwBtn"
                title="切換顯示/隱藏金鑰"
                onclick="window.toggleGatePasswordVisibility()"
              >
                👁️
              </button>
            </div>
          </div>

          <button type="submit" class="gate-btn" id="gateSubmitBtn">
            <span>解鎖並進入校園</span>
            <span>🚀</span>
          </button>

          <div class="gate-error" id="gateErrorMsg">
            <span>⚠️</span>
            <span id="gateErrorText">通行金鑰有誤，請重新輸入</span>
          </div>
        </form>
      </div>
    </div>

    <!-- 門禁驗證核心邏輯腳本 -->
    <script>
      (function() {
        const AUTH_STORAGE_KEY = 'shu_campus_access_granted_v1';
        // SHA-256 hash of "nato"
        const TARGET_HASH = '5cae49b1fea5b5b969cdc931b8338968940c92309aa2339360cdd5c77be4a4ff';

        const gateEl = document.getElementById('passwordGate');
        const cardEl = document.getElementById('gateCard');
        const inputEl = document.getElementById('gatePasswordInput');
        const errorEl = document.getElementById('gateErrorMsg');
        const relockBtn = document.getElementById('gateRelockBtn');

        async function sha256(str) {
          try {
            if (window.crypto && crypto.subtle) {
              const buffer = new TextEncoder().encode(str);
              const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
              const hashArray = Array.from(new Uint8Array(hashBuffer));
              return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }
          } catch(e) {
            console.warn('Crypto subtle unavailable:', e);
          }
          return null;
        }

        function checkAuth() {
          if (localStorage.getItem(AUTH_STORAGE_KEY) === 'true') {
            unlockGate(false);
          } else {
            lockGate();
          }
        }

        function lockGate() {
          gateEl.classList.remove('gate-hidden');
          relockBtn.style.display = 'none';
          if (inputEl) {
            inputEl.value = '';
            setTimeout(() => inputEl.focus(), 150);
          }
          if (errorEl) errorEl.style.display = 'none';
        }

        function unlockGate(animate = true) {
          gateEl.classList.add('gate-hidden');
          relockBtn.style.display = 'flex';
          localStorage.setItem(AUTH_STORAGE_KEY, 'true');
        }

        window.verifyGatePass = async function() {
          const val = (inputEl.value || '').trim();
          if (!val) {
            showError('請輸入通行金鑰');
            return;
          }

          const normalized = val.toLowerCase();
          const hash = await sha256(normalized);

          if (hash === TARGET_HASH || normalized === 'nato') {
            if (errorEl) errorEl.style.display = 'none';
            unlockGate(true);
          } else {
            showError('通行金鑰有誤，請重新輸入');
          }
        };

        function showError(msg) {
          if (errorEl) {
            document.getElementById('gateErrorText').textContent = msg;
            errorEl.style.display = 'flex';
          }
          cardEl.classList.remove('shake');
          void cardEl.offsetWidth;
          cardEl.classList.add('shake');
          inputEl.focus();
          inputEl.select();
        }

        window.toggleGatePasswordVisibility = function() {
          if (inputEl.type === 'password') {
            inputEl.type = 'text';
          } else {
            inputEl.type = 'password';
          }
        };

        relockBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          localStorage.removeItem(AUTH_STORAGE_KEY);
          lockGate();
        });

        window.addEventListener('keydown', function(e) {
          if (!gateEl.classList.contains('gate-hidden')) {
            if (e.target !== inputEl) {
              e.stopPropagation();
            }
          }
        }, true);

        checkAuth();
      })();
    </script>
